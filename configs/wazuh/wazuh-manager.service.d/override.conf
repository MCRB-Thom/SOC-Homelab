# /etc/systemd/system/wazuh-manager.service.d/override.conf (VM Wazuh 109)
# Au boot, indexer + dashboard + manager démarrent ensemble sur 2 vCPU / 5 Go
# et un disque lent : le manager dépassait le délai par défaut et systemd le
# marquait "failed". On le démarre après l'indexer pour étaler les accès disque.
[Unit]
After=wazuh-indexer.service

[Service]
TimeoutStartSec=300
