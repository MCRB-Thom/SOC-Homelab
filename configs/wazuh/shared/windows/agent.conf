<!-- /var/ossec/etc/shared/windows/agent.conf (manager Wazuh)
     Configuration centralisée du groupe d'agents "windows" (dc01, ws01).
     Par défaut, l'agent Windows ne collecte que les journaux Application,
     Security et System : le canal Sysmon doit être ajouté explicitement. -->
<agent_config os="Windows">
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
