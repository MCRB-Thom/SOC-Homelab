# Déployé sur la VM Wazuh : /etc/systemd/system/suricata.service.d/override.conf
# Désactive les optimisations de la carte de capture (GRO/GSO/TSO) avant chaque démarrage de Suricata :
# sur une interface virtio, elles fusionnent les paquets et faussent le suivi des flux TCP
# (alertes "SURICATA STREAM" en rafale). Recommandation de la documentation Suricata (AF_PACKET).
[Service]
ExecStartPre=/usr/sbin/ethtool -K enp6s19 gro off gso off tso off
