networks:
  soc-net:
    name: soc-net
    driver: bridge

volumes:
  ollama_data:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - soc-net
    environment:
      # écoute sur toutes les interfaces du conteneur pour être joignable
      # depuis les autres conteneurs du réseau soc-net (ex: l'API Wazuh->Ollama)
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------------
  # Pont Wazuh -> Ollama (conteneurisation prévue)
